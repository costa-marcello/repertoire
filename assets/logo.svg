    <rect x="-30" y="-110" width="60" height="104" rx="8" fill="#F5EEDF" stroke="#0F3B2E" stroke-width="3"/>
    <rect x="-23" y="-103" width="46" height="90" rx="4" fill="none" stroke="#0F3B2E" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="-18" cy="-96" r="4.5" fill="#E8452C"/>
