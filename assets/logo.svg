<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Repertoire">
  <!-- Repertoire: nine cards fanned out, one per skill, with the red R card played -->
  <rect width="256" height="256" rx="58" fill="#0F3B2E"/>

  <!-- Eight cards, drawn from the outside in so each overlaps the one beyond it -->
